<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Browser translate must never send document text out (FR-6.18). -->
    <meta name="google" content="notranslate" />
    <meta name="referrer" content="no-referrer" />
    <!-- Filled by the local server at request time (API-1). Empty = fixture/demo mode. -->
    <meta name="nabu-token" content="">
    <title>Nabu</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="notranslate">
    <header class="topbar">
      <div class="brand">Nabu</div>
      <label class="hdr-field">Document type
        <input id="doc-type" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" />
      </label>
      <label class="hdr-field">Region
        <input id="region" type="text" maxlength="2" spellcheck="false" autocomplete="off" autocapitalize="characters" />
      </label>
      <span id="mode" class="mode" role="status"></span>
      <button id="verify" class="primary" type="button">Verify</button>
    </header>
    <div id="banner" class="banner" role="status"></div>
    <main class="panes">
      <section class="page-pane" aria-label="Document page">
        <svg id="page" role="img" aria-label="Page 1 with highlighted fields"></svg>
      </section>
      <section class="fields-pane" aria-label="Fields">
        <div class="list-tools">
          <label><input id="order-toggle" type="checkbox" /> Document order</label>
          <label><input id="lang-toggle" type="checkbox" /> Show originals</label>
        </div>
        <ol id="fields" class="fields"></ol>
        <details id="removed" class="removed">
          <summary>Show removed fields (<span id="removed-count">0</span>)</summary>
          <ol id="removed-list"></ol>
        </details>
      </section>
    </main>
    <dialog id="summary">
      <h2>Verify</h2>
      <p id="summary-text"></p>
      <ul id="summary-issues"></ul>
      <div class="dialog-actions">
        <button id="summary-back" type="button">Back</button>
        <button id="summary-confirm" class="primary" type="button">Confirm</button>
      </div>
    </dialog>
    <footer class="footer">
      <span>Nothing leaves this machine. Values are not stored. Browser extensions can read this window.</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
