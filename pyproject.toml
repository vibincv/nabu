[project]
name = "nabu"
version = "0.1.0.dev0"
description = "Private, local document reader: reads any document on your machine, you verify, it outputs JSON. Nothing leaves the machine."
readme = "README.md"
requires-python = ">=3.11"
# License not chosen yet. Decide before any public release (see README).
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Reading stack. Optional extra; measured ~270 MB on disk (NFR-2 budget 300 MB, tasks/m0-ocr.md).
# Licences checked: pypdfium2 (Apache-2.0/BSD-3), pdfplumber (MIT), rapidocr (Apache-2.0, bundles
# PP-OCR models, Apache-2.0), onnxruntime (MIT), python-docx/openpyxl/python-pptx (MIT),
# pillow (MIT-CMU). Do NOT add PyMuPDF (AGPL-3.0).
# rapidocr is pinned to 3.10.x: the OCR adapter relies on its call flags and word boxes, and
# rapidocr-onnxruntime (the old package) does not support Python 3.13.
read = [
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "rapidocr>=3.10,<3.11",
    "onnxruntime>=1.20",
    "pillow>=10.1",  # page image resize/crop for the model (MIT-CMU)
]

[project.scripts]
nabu = "nabu.cli:main"

[dependency-groups]
dev = [
    "pillow>=10.1",  # model-layer tests build page images
    "pytest>=8.2",
    "jsonschema>=4.22",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built review UI (ui/ -> src/nabu/server/ui_dist) is git-ignored but ships in the wheel.
artifacts = ["src/nabu/server/ui_dist/"]

[tool.hatch.build.targets.wheel]
packages = ["src/nabu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tasks"]  # planning notes and spike scripts, not product code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
