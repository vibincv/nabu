name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui_dist
          path: src/nabu/server/ui_dist

  test:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ui_dist
          path: src/nabu/server/ui_dist
      # Dependencies are fetched first. The tests run under the in-process egress guard
      # (tests/conftest.py), so any outbound attempt fails the run on every OS.
      # The reading stack (OCR, PDF, office) is an extra; M1 tests need it. OCR models ship in
      # the rapidocr wheel, so the offline run below needs nothing more.
      - run: uv sync --locked --extra read
      - run: uv run ruff check .
      - run: uv run pytest
      # Linux only: run the suite again inside a network namespace with no network at all (NFR-1).
      - name: pytest with network disabled (Linux)
        if: runner.os == 'Linux'
        run: |
          # A new network namespace has only a loopback device, and it starts down.
          sudo unshare --net -- sh -c \
            'ip link set lo up && exec sudo -u "$0" env PATH="$1" HOME="$2" .venv/bin/python -m pytest -q' \
            "$USER" "$PATH" "$HOME"
